<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121110" />
    <!-- Resolve the theme before first paint. Night is the house default —
         the OS preference is deliberately NOT consulted, so a first visit
         looks the same on every machine; only a press of the header toggle
         (which writes the key read here) moves anyone to day. The stylesheet
         has no prefers-color-scheme copy of the dark ramp, so data-theme must
         always be set here. -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = 'dark';
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name=theme-color]').content =
          t === 'dark' ? '#121110' : '#f4f0e6';
      })();
    </script>
    <meta name="description" content="Xabi's Long-Xo — model-driven Fantasy Premier League squad, transfer, and chip recommendations." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <title>Xabi's Long-Xo — FPL 26/27 War Room</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
